<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>
    <h1>Formulario de inscripción</h1>

<form action="index.html" method="get">
    <fieldset>
        <legend>Datos personales by Leonel</legend>
                <p>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre"
                   placeholder="Escribe tu nombre"
                   required autofocus size="30" maxlength="40">
        </p>

        <p>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password"
                   minlength="8">
        </p>

        <p>
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono"
                   pattern="[0-9]{9}"
                   title="Introduce un teléfono de 9 dígitos">
        </p>
                <p>
            <label for="fecha">Fecha de nacimiento: </label>
            <input type="date" id="fecha" name="fecha">
        </p>

        <p>
            <label for="foto">Fotografía:</label>
            <input type="file" id="foto" name="foto">
        </p>

        <p>
            <label for="curso">Curso:</label>
            <input type="text" id="curso" name="curso"
                   value="2026-27" readonly>
        </p>

        <p>
            <label for="centro">Centro educativo :</label>
            <input type="text" id="centro" name="centro"
                   value="IES La Asunción" disabled>
        </p>
    </fieldset>

    <fieldset>
        <legend>Preferencias</legend>
                <p>Turno:</p>

        <p>
            <input type="radio" id="manana" name="turno" value="manana">
            <label for="manana">Mañana</label>
        </p>

        <p>
            <input type="radio" id="tarde" name="turno" value="tarde">
            <label for="tarde">Tarde</label>
        </p>

        <p>Intereses:</p>

        <p>
            <input type="checkbox" id="redes" name="intereses" value="redes">
            <label for="redes">Redes</label>
        </p>

        <p>
            <input type="checkbox" id="programacion" name="intereses" value="programacion">
            <label for="programacion">Programación</label>
        </p>

        <p>
            <input type="checkbox" id="hardware" name="intereses" value="hardware">
            <label for="hardware">Hardware</label>
        </p>
                <p>
            <label for="horas">Horas de estudio:</label>
            <input type="number" id="horas" name="horas"
                   min="0" max="10" step="2">
        </p>

        <p>
            <label for="nivel">Nivel de informática:</label>
            <input type="range" id="nivel" name="nivel" min="1" max="10">
        </p>

        <p>
            <label for="color">Color favorito:</label>
            <input type="color" id="color" name="color">
        </p>

        <p>
            <label for="hora">Hora preferida:</label>
            <input type="time" id="hora" name="hora">
        </p>

        <p>
            <label for="semana">Semana:</label>
            <input type="week" id="semana" name="semana">
        </p>

        <p>
            <label for="mes">Mes:</label>
            <input type="month" id="mes" name="mes">
        </p>
    </fieldset>
</form>
</body>
</html>
